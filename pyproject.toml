[project]
name = "yt-dlp-threads"
version = "0.1.0"
description = "yt-dlp extractor plugin for Threads (threads.com / threads.net)"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default,curl-cffi]"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]
